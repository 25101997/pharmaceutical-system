services:
  database:
    image: gvenzl/oracle-xe:21-slim
    container_name: farmacias-prod-database
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${DB_USER}
      APP_USER_PASSWORD: ${DB_PASSWORD}
    volumes:
      - farmacias_prod_oradata:/opt/oracle/oradata
    networks: [farmacias-prod-network]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  api:
    image: farmacias-api:prod
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.prod
    container_name: farmacias-prod-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CONNECT_STRING: ${DB_CONNECT_STRING}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ALLOWED: ${CORS_ALLOWED}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8180}:3000"
    networks: [farmacias-prod-network]

  web:
    image: farmacias-web:prod
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.prod
    container_name: farmacias-prod-web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3110}:80"
    networks: [farmacias-prod-network]

volumes:
  farmacias_prod_oradata:

networks:
  farmacias-prod-network:
    name: farmacias-prod-network
    driver: bridge
