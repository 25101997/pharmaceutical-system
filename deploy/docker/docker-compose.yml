services:
  database:
    image: gvenzl/oracle-xe:21-slim
    container_name: farmacias-dev-database
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${DB_USER}
      APP_USER_PASSWORD: ${DB_PASSWORD}
    volumes:
      - farmacias_dev_oradata:/opt/oracle/oradata
      - ../../database/init:/container-entrypoint-initdb.d:ro
    ports:
      - "1521:1521"
    networks: [farmacias-dev-network]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    image: farmacias-api:dev
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.dev
    container_name: farmacias-dev-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3000}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CONNECT_STRING: ${DB_CONNECT_STRING}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ALLOWED: ${CORS_ALLOWED}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ../../apps/api:/app
      - farmacias_api_node_modules:/app/node_modules
    ports:
      - "${API_PORT:-3000}:3000"
    networks: [farmacias-dev-network]

  web:
    image: farmacias-web:dev
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.dev
    container_name: farmacias-dev-web
    restart: unless-stopped
    environment:
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000/api}
      CHOKIDAR_USEPOLLING: "true"
    depends_on: [api]
    volumes:
      - ../../apps/web:/app
      - farmacias_web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-4200}:4200"
    networks: [farmacias-dev-network]

volumes:
  farmacias_dev_oradata:
  farmacias_api_node_modules:
  farmacias_web_node_modules:

networks:
  farmacias-dev-network:
    name: farmacias-dev-network
    driver: bridge
